syntax = "proto3";

package debugger;

message BusControlRequest {
  bool acquire = 1;
}

message PowerOnBusRequest {
  bool enable = 1;
}

enum Const {
    CONST_UNSPECIFIED = 0;
    // Max bytes of flash data per single request and response. Multiple of the AT28C256 64-byte write page.
    CONST_MAX_CHUNK_SIZE = 1024;
}

enum ErrType {
    ERROR_TYPE_UNSPECIFIED = 0;
    ERROR_TYPE_OK = 1;
    ERROR_TYPE_TIMEOUT = 2;
    ERROR_TYPE_FATAL = 3;
    ERROR_TYPE_BUS_NOT_ACQUIRED = 4;
    ERROR_TYPE_OUT_OF_RANGE = 5;
    ERROR_TYPE_BAD_REQUEST = 6;
    ERROR_TYPE_RX_OVERRUN = 7;
}

message ErrorResponse {
    ErrType err_type = 1;
    optional string msg = 2;
}

message WriteFlashRequest {
    uint32 address = 1;
    bytes data = 2; // at most CONST_MAX_CHUNK_SIZE bytes
}

message ReadFlashRequest {
    uint32 address = 1;
    uint32 size = 2; // at most CONST_MAX_CHUNK_SIZE bytes
}

message ReadFlashResponse {
    ErrorResponse status = 1;
    bytes data = 2;
}

message RpcRequest {
    uint32 request_id = 1;

    oneof payload {
        BusControlRequest bus_control_request = 2;
        PowerOnBusRequest power_on_bus_request = 3;
        WriteFlashRequest write_flash = 4;
        ReadFlashRequest read_flash = 5;
    }
}

message RpcResponse {
    uint32 request_id = 1;

    oneof payload {
        ErrorResponse bus_control_request = 2;
        ErrorResponse power_on_bus_request = 3;
        ErrorResponse write_flash = 4;
        ReadFlashResponse read_flash = 5;
        ErrorResponse generic = 6;
    }
}
